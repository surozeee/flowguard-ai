server:
  port: ${AUTH_SERVER_PORT:9000}

spring:
  application:
    name: flowguard-auth-server

flowguard:
  auth:
    issuer: ${FLOWGUARD_AUTH_ISSUER:http://localhost:9000}
    introspection-client-id: ${AUTH_CLIENT_ID:flowguard-gateway}
    introspection-client-secret: ${AUTH_CLIENT_SECRET:flowguard-gateway-secret}
    ui-client-id: ${AUTH_UI_CLIENT_ID:flowguard-ui}
    ui-client-secret: ${AUTH_UI_CLIENT_SECRET:flowguard-ui-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
