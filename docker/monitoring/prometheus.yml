global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: flowguard-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["flowguard-backend:8080"]

  - job_name: fixture-wallet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fixture-wallet:8081"]

  - job_name: flowguard-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["flowguard-api-gateway:8088"]
