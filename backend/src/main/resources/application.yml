server:
  port: 8080

spring:
  application:
    name: flowguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowguard?currentSchema=metadata}
    username: ${SPRING_DATASOURCE_USERNAME:flowguard}
    password: ${SPRING_DATASOURCE_PASSWORD:flowguard}
    hikari:
      connection-init-sql: SET search_path TO metadata
  flyway:
    schemas: metadata
    default-schema: metadata
    locations: classpath:db/migration/metadata
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: metadata
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: flowguard-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "java.util,java.lang,ai.flowguard"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

flowguard:
  production:
    guards-enabled: ${FLOWGUARD_PRODUCTION_GUARDS:false}
  security:
    api-key: ${FLOWGUARD_API_KEY:}
    oauth:
      enabled: ${FLOWGUARD_OAUTH_ENABLED:false}
      introspection-uri: ${AUTH_INTROSPECT_URL:http://localhost:9000/oauth2/introspect}
      client-id: ${AUTH_CLIENT_ID:flowguard-gateway}
      client-secret: ${AUTH_CLIENT_SECRET:flowguard-gateway-secret}
  gateway:
    base-url: ${FLOWGUARD_API_GATEWAY_URL:}
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
  fixture:
    base-url: ${FIXTURE_WALLET_URL:http://localhost:8081}
    customer-account-id: "00000000-0000-4000-8000-000000000002"
    internal-token: ${FIXTURE_INTERNAL_TOKEN:}
  investigation:
    sync-pipeline: ${FLOWGUARD_INVESTIGATION_SYNC:false}
  meta:
    base-url: ${MODEL_API_BASE_URL:https://api.meta.ai/v1}
    api-key: ${MODEL_API_KEY:}
    model-id: ${MODEL_ID:muse-spark-1.3}
    stub-when-no-key: true
  kafka:
    messaging-enabled: ${FLOWGUARD_MESSAGING_ENABLED:true}
    topics:
      investigations: flowguard.investigations
      experiments: flowguard.experiments
      evidence: flowguard.evidence
      evidence-processed: flowguard.evidence.processed
      transactions: flowguard.transactions
      saga-events: flowguard.saga.events
    groups:
      transactions: flowguard-backend-transactions
      saga-events: flowguard-backend-saga-choreography
      evidence: flowguard-backend-evidence

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,flowguardReadiness
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
